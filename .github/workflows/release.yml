name: release

# Tag-triggered release builds. All five targets cross-compile on ubuntu
# runners; a final publish job attaches everything to the release in one
# step (avoids concurrent-upload races between matrix jobs).

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [x86_64-linux-musl, x86_64-linux-gnu, aarch64-linux-musl, aarch64-macos, x86_64-macos]
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Build
        run: zig build -Doptimize=ReleaseSafe -Dtarget=${{ matrix.target }}
      - name: Package
        run: |
          tar -czf "ifnh-${{ matrix.target }}.tar.gz" -C zig-out/bin ifnh
          sha256sum "ifnh-${{ matrix.target }}.tar.gz" > "ifnh-${{ matrix.target }}.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: |
            ifnh-*.tar.gz
            ifnh-*.tar.gz.sha256

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
