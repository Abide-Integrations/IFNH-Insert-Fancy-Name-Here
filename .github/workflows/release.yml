name: release

# Tag-triggered release builds — all four targets cross-compiled on a
# single ubuntu runner (cheap: ~2-3 min total per release).

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [x86_64-linux-musl, x86_64-linux-gnu, aarch64-linux-musl, aarch64-macos, x86_64-macos]
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Build
        run: zig build -Doptimize=ReleaseSafe -Dtarget=${{ matrix.target }}
      - name: Package
        run: |
          tar -czf "ifnh-${{ matrix.target }}.tar.gz" -C zig-out/bin ifnh
          sha256sum "ifnh-${{ matrix.target }}.tar.gz" > "ifnh-${{ matrix.target }}.tar.gz.sha256"
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            ifnh-*.tar.gz
            ifnh-*.tar.gz.sha256
