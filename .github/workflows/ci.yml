name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Format check
        run: zig fmt --check src/ tests/
      - name: Build
        run: zig build -Doptimize=ReleaseSafe
      - name: Test
        run: zig build test
      - name: Binary size budget (< 5 MiB)
        run: |
          size=$(stat -c%s zig-out/bin/ifnh 2>/dev/null || stat -f%z zig-out/bin/ifnh)
          echo "binary size: $size bytes"
          test "$size" -lt 5242880
