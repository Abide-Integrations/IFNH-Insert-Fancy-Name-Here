name: ci

# Kept deliberately lean (minute budget):
# - ubuntu only (macOS releases are cross-compiled in release.yml)
# - superseded runs cancel automatically
# - docs-only changes skip the run

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**"]
  pull_request:
    paths-ignore: ["**.md", "docs/**"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Format check
        run: zig fmt --check src/
      - name: Test
        run: zig build test
      - name: Build (ReleaseSafe)
        run: zig build -Doptimize=ReleaseSafe
      - name: Binary size budget (< 5 MiB)
        run: |
          size=$(stat -c%s zig-out/bin/ifnh)
          echo "binary size: $size bytes"
          test "$size" -lt 5242880
      - name: Startup budget (< 50ms mean over 20 runs)
        run: |
          total=0
          for i in $(seq 1 20); do
            start=$(date +%s%N)
            ./zig-out/bin/ifnh config validate > /dev/null 2>&1 || ./zig-out/bin/ifnh --version > /dev/null
            end=$(date +%s%N)
            total=$((total + (end - start)))
          done
          mean_ms=$((total / 20 / 1000000))
          echo "mean startup: ${mean_ms}ms"
          test "$mean_ms" -lt 50
      - name: Integration harnesses
        run: |
          ./scripts/bench.sh
          ./tests/integration-kill9.sh
