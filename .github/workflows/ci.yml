name: ci

# Kept deliberately lean (minute budget):
# - ubuntu only (macOS releases are cross-compiled in release.yml)
# - superseded runs cancel automatically
# - docs-only changes skip the run

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**"]
  pull_request:
    paths-ignore: ["**.md", "docs/**"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Format check
        run: zig fmt --check src/
      - name: Test
        run: zig build test
      - name: Build (ReleaseSafe)
        run: zig build -Doptimize=ReleaseSafe
      - name: Binary size budget (< 5 MiB)
        run: |
          size=$(stat -c%s zig-out/bin/ifnh)
          echo "binary size: $size bytes"
          test "$size" -lt 5242880
      - name: Performance budgets (scripts/bench.sh)
        run: ./scripts/bench.sh
      - name: Integration harnesses
        run: ./tests/integration-kill9.sh
