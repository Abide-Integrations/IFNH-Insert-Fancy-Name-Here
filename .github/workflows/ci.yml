name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Format check
        run: zig fmt --check src/ tests/
      - name: Build
        run: zig build -Doptimize=ReleaseSafe
      - name: Test
        run: zig build test
      - name: Binary size budget (< 5 MiB)
        run: |
          size=$(stat -c%s zig-out/bin/ifnh 2>/dev/null || stat -f%z zig-out/bin/ifnh)
          echo "binary size: $size bytes"
          test "$size" -lt 5242880
      - name: Startup budget (< 50ms mean over 20 runs)
        run: |
          total=0
          for i in $(seq 1 20); do
            start=$(date +%s%N)
            ./zig-out/bin/ifnh config validate > /dev/null 2>&1 || ./zig-out/bin/ifnh --version > /dev/null
            end=$(date +%s%N)
            total=$((total + (end - start)))
          done
          mean_ms=$((total / 20 / 1000000))
          echo "mean startup: ${mean_ms}ms"
          test "$mean_ms" -lt 50
